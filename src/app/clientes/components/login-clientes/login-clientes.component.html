<div class="form-style-one">
  <div class="text-center mb-40">
    <h2>{{ 'CLIENTES.LOGIN_TITLE' | translate }}</h2>
    <p class="text-muted">{{ 'CLIENTES.LOGIN_SUB' | translate }}</p>
  </div>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="row">
      <div class="col-12 mb-30">
        <div class="input-group-meta form-group">
          <label for="cl-email">{{ 'ADMIN.EMAIL' | translate }}*</label>
          <input id="cl-email" type="email" formControlName="email" autocomplete="username" class="form-control"
            [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched">
        </div>
      </div>
      <div class="col-12 mb-30">
        <div class="input-group-meta form-group">
          <label for="cl-pass">{{ 'ADMIN.PASSWORD' | translate }}*</label>
          <input id="cl-pass" type="password" formControlName="password" autocomplete="current-password" class="form-control"
            [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
        </div>
      </div>
      <div class="col-12 mt-20">
        <button type="submit" class="btn-four tran3s cl-submit w-100" [disabled]="form.invalid || loading">
          <span *ngIf="!loading">{{ 'ADMIN.LOGIN_BTN' | translate }}</span>
          <span *ngIf="loading"><i class="spinner-border spinner-border-sm me-2"></i>{{ 'CLIENTES.SENDING' | translate }}</span>
        </button>
      </div>
    </div>
  </form>
</div>
