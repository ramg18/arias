<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <p class="text-muted mb-4">{{ 'CLIENTES.FACTURAS_DESC' | translate }}</p>
  <div class="row">
    <div class="col-md-6 mb-4">
      <app-file-dropzone label="CLIENTES.XML" hint="CLIENTES.XML_HINT" accept=".xml,text/xml,application/xml"
        icon="fa-file-code" [typePattern]="xmlPattern" [maxMB]="5" [multiple]="true" [maxFiles]="maxFiles"
        [files]="form.value.xml || []"
        [invalid]="!!(form.get('xml')?.touched && form.get('xml')?.invalid)"
        (filesChange)="setFiles('xml', $event)"></app-file-dropzone>
    </div>
    <div class="col-md-6 mb-4">
      <app-file-dropzone label="CLIENTES.IMAGEN" hint="CLIENTES.IMG_HINT" accept="image/*"
        icon="fa-image" [typePattern]="imgPattern" [maxMB]="8" [multiple]="true" [maxFiles]="maxFiles"
        [files]="form.value.imagen || []" [required]="false"
        (filesChange)="setFiles('imagen', $event)"></app-file-dropzone>
    </div>
  </div>
  <small class="text-danger d-block mb-3" *ngIf="totalTooBig">{{ 'CLIENTES.ERR_TOTAL' | translate: { max: maxTotalMB } }}</small>
  <div class="d-flex justify-content-end">
    <button type="submit" class="btn-four tran3s cl-submit" [disabled]="form.invalid || loading || totalTooBig">
    <span *ngIf="!loading">{{ 'CLIENTES.SEND' | translate }}</span>
    <span *ngIf="loading"><i class="spinner-border spinner-border-sm me-2"></i>{{ 'CLIENTES.SENDING' | translate }}</span>
  </button>
  </div>
</form>
